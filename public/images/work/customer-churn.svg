<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <radialGradient id="ccGlow" cx="15%" cy="85%" r="60%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <pattern id="ccGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="#0d0b12"/>
  <rect width="800" height="450" fill="url(#ccGrid)"/>
  <rect width="800" height="450" fill="url(#ccGlow)"/>

  <text x="60" y="56" fill="#ffffff" font-size="22" font-weight="700">Customer Churn &amp; Retention</text>
  <text x="60" y="78" fill="#a89fbd" font-size="13" letter-spacing="1">SHAP INTERPRETABILITY · CLV &amp; RETENTION SIGNALS</text>

  <!-- donut chart: retained vs churned -->
  <g transform="translate(170,240)">
    <circle r="80" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="24"/>
    <circle r="80" fill="none" stroke="#a78bfa" stroke-width="24" stroke-dasharray="376 502" stroke-dashoffset="0" transform="rotate(-90)"/>
    <circle r="80" fill="none" stroke="#e2b23c" stroke-width="24" stroke-dasharray="126 502" stroke-dashoffset="-376" transform="rotate(-90)"/>
    <text x="0" y="-4" text-anchor="middle" fill="#ffffff" font-size="26" font-weight="700">75%</text>
    <text x="0" y="18" text-anchor="middle" fill="#8b8794" font-size="11" letter-spacing="1">RETAINED</text>
  </g>

  <g transform="translate(60,360)">
    <circle cx="0" cy="-4" r="6" fill="#a78bfa"/>
    <text x="14" y="0" fill="#c7c2d6" font-size="12">Retained</text>
    <circle cx="110" cy="-4" r="6" fill="#e2b23c"/>
    <text x="124" y="0" fill="#c7c2d6" font-size="12">At-risk / churned</text>
  </g>

  <!-- SHAP feature bars -->
  <g transform="translate(360,120)">
    <rect x="0" y="0" width="380" height="240" rx="14" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="20" y="28" fill="#c7c2d6" font-size="11" letter-spacing="1" font-weight="700">TOP CHURN DRIVERS (SHAP)</text>

    <text x="20" y="58" fill="#a89fbd" font-size="11">Support tickets</text>
    <rect x="150" y="48" width="200" height="10" rx="5" fill="#ffffff" fill-opacity="0.06"/>
    <rect x="150" y="48" width="160" height="10" rx="5" fill="#a78bfa"/>

    <text x="20" y="88" fill="#a89fbd" font-size="11">Days since last login</text>
    <rect x="150" y="78" width="200" height="10" rx="5" fill="#ffffff" fill-opacity="0.06"/>
    <rect x="150" y="78" width="128" height="10" rx="5" fill="#a78bfa"/>

    <text x="20" y="118" fill="#a89fbd" font-size="11">Contract length</text>
    <rect x="150" y="108" width="200" height="10" rx="5" fill="#ffffff" fill-opacity="0.06"/>
    <rect x="150" y="108" width="96" height="10" rx="5" fill="#a78bfa"/>

    <text x="20" y="148" fill="#a89fbd" font-size="11">Discount usage</text>
    <rect x="150" y="138" width="200" height="10" rx="5" fill="#ffffff" fill-opacity="0.06"/>
    <rect x="150" y="138" width="70" height="10" rx="5" fill="#a78bfa"/>

    <line x1="20" y1="172" x2="360" y2="172" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="20" y="198" fill="#8b8794" font-size="10.5" letter-spacing="1">CUSTOMER LIFETIME VALUE</text>
    <text x="20" y="220" fill="#ffffff" font-size="17" font-weight="700">£2,340 avg</text>
  </g>

  <text x="60" y="410" fill="#6f6b78" font-size="11" letter-spacing="1" font-weight="500">PYTHON · SQL · SCIKIT-LEARN · SHAP · POWER BI</text>
</svg>
