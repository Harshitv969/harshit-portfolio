<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <radialGradient id="epGlow" cx="90%" cy="90%" r="60%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <pattern id="epGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="#0d0b12"/>
  <rect width="800" height="450" fill="url(#epGrid)"/>
  <rect width="800" height="450" fill="url(#epGlow)"/>

  <text x="60" y="56" fill="#ffffff" font-size="22" font-weight="700">Employee &amp; Payroll Management</text>
  <text x="60" y="78" fill="#a89fbd" font-size="13" letter-spacing="1">MICROSERVICES · JWT &amp; ROLE-BASED ACCESS</text>

  <!-- table -->
  <g transform="translate(60,110)">
    <rect x="0" y="0" width="500" height="230" rx="14" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.1"/>
    <!-- header -->
    <rect x="0" y="0" width="500" height="34" rx="14" fill="#ffffff" fill-opacity="0.05"/>
    <text x="20" y="22" fill="#c7c2d6" font-size="11" letter-spacing="1" font-weight="700">EMPLOYEE</text>
    <text x="220" y="22" fill="#c7c2d6" font-size="11" letter-spacing="1" font-weight="700">ROLE</text>
    <text x="330" y="22" fill="#c7c2d6" font-size="11" letter-spacing="1" font-weight="700">SALARY</text>
    <text x="430" y="22" fill="#c7c2d6" font-size="11" letter-spacing="1" font-weight="700">NET</text>

    <!-- rows -->
    <g font-size="12" fill="#e6e1ef">
      <line x1="0" y1="34" x2="500" y2="34" stroke="#ffffff" stroke-opacity="0.06"/>
      <text x="20" y="58" fill="#ffffff" fill-opacity="0.85">A. Sharma</text>
      <text x="220" y="58" fill="#a89fbd">Recruiter</text>
      <text x="330" y="58">£3,120</text>
      <text x="430" y="58" fill="#a78bfa" font-weight="700">£2,640</text>

      <line x1="0" y1="70" x2="500" y2="70" stroke="#ffffff" stroke-opacity="0.06"/>
      <text x="20" y="94" fill="#ffffff" fill-opacity="0.85">R. Iyer</text>
      <text x="220" y="94" fill="#a89fbd">Admin</text>
      <text x="330" y="94">£3,850</text>
      <text x="430" y="94" fill="#a78bfa" font-weight="700">£3,205</text>

      <line x1="0" y1="106" x2="500" y2="106" stroke="#ffffff" stroke-opacity="0.06"/>
      <text x="20" y="130" fill="#ffffff" fill-opacity="0.85">D. Fox</text>
      <text x="220" y="130" fill="#a89fbd">Manager</text>
      <text x="330" y="130">£4,600</text>
      <text x="430" y="130" fill="#a78bfa" font-weight="700">£3,890</text>

      <line x1="0" y1="142" x2="500" y2="142" stroke="#ffffff" stroke-opacity="0.06"/>
      <text x="20" y="166" fill="#ffffff" fill-opacity="0.85">S. Osei</text>
      <text x="220" y="166" fill="#a89fbd">Attendance</text>
      <text x="330" y="166">£2,980</text>
      <text x="430" y="166" fill="#a78bfa" font-weight="700">£2,510</text>

      <line x1="0" y1="178" x2="500" y2="178" stroke="#ffffff" stroke-opacity="0.06"/>
      <text x="20" y="202" fill="#ffffff" fill-opacity="0.6">+ 46 more employees</text>
    </g>
  </g>

  <!-- summary card -->
  <g transform="translate(590,110)">
    <rect x="0" y="0" width="150" height="230" rx="14" fill="#ffffff" fill-opacity="0.04" stroke="#c2a4ff" stroke-opacity="0.35"/>
    <text x="18" y="34" fill="#8b8794" font-size="10.5" letter-spacing="1">TOTAL PAYROLL</text>
    <text x="18" y="62" fill="#ffffff" font-size="20" font-weight="700">£128,450</text>

    <text x="18" y="102" fill="#8b8794" font-size="10.5" letter-spacing="1">DEPARTMENTS</text>
    <text x="18" y="122" fill="#e6e1ef" font-size="13">5 services</text>

    <text x="18" y="156" fill="#8b8794" font-size="10.5" letter-spacing="1">ROLES</text>
    <text x="18" y="176" fill="#e6e1ef" font-size="13">4 RBAC tiers</text>

    <circle cx="30" cy="204" r="4" fill="#7fe0b0"/>
    <text x="42" y="208" fill="#c7c2d6" font-size="11">JWT secured</text>
  </g>

  <text x="60" y="380" fill="#6f6b78" font-size="11" letter-spacing="1" font-weight="500">JAVA · SPRING BOOT · SPRING SECURITY · MYSQL</text>
</svg>
