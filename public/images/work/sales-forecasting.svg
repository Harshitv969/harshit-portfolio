<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <radialGradient id="sfGlow" cx="85%" cy="10%" r="60%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <pattern id="sfGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <linearGradient id="sfArea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="#0d0b12"/>
  <rect width="800" height="450" fill="url(#sfGrid)"/>
  <rect width="800" height="450" fill="url(#sfGlow)"/>

  <text x="60" y="56" fill="#ffffff" font-size="22" font-weight="700">Sales &amp; Revenue Forecasting</text>
  <text x="60" y="78" fill="#a89fbd" font-size="13" letter-spacing="1">TIME SERIES · QUARTERLY PROJECTIONS</text>

  <!-- KPI chips -->
  <g transform="translate(60,100)">
    <rect x="0" y="0" width="150" height="52" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="14" y="20" fill="#8b8794" font-size="10" letter-spacing="1">REVENUE (QTD)</text>
    <text x="14" y="40" fill="#ffffff" font-size="16" font-weight="700">£486K</text>

    <rect x="164" y="0" width="150" height="52" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="178" y="20" fill="#8b8794" font-size="10" letter-spacing="1">FORECAST Q3</text>
    <text x="178" y="40" fill="#7fe0b0" font-size="16" font-weight="700">▲ 12.4%</text>

    <rect x="328" y="0" width="150" height="52" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="342" y="20" fill="#8b8794" font-size="10" letter-spacing="1">TOP REGION</text>
    <text x="342" y="40" fill="#ffffff" font-size="16" font-weight="700">North UK</text>
  </g>

  <!-- chart -->
  <g transform="translate(60,190)">
    <line x1="0" y1="180" x2="640" y2="180" stroke="#ffffff" stroke-opacity="0.12"/>
    <line x1="0" y1="0" x2="0" y2="180" stroke="#ffffff" stroke-opacity="0.12"/>

    <!-- historical area + line -->
    <path d="M0,140 L80,120 L160,132 L240,96 L320,104 L400,70 L400,180 L0,180 Z" fill="url(#sfArea)"/>
    <path d="M0,140 L80,120 L160,132 L240,96 L320,104 L400,70" fill="none" stroke="#c2a4ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- forecast dashed continuation -->
    <path d="M400,70 L480,58 L560,40 L640,26" fill="none" stroke="#c2a4ff" stroke-width="3" stroke-dasharray="2,8" stroke-linecap="round"/>
    <circle cx="400" cy="70" r="5" fill="#ffffff"/>
    <circle cx="640" cy="26" r="5" fill="#7fe0b0"/>

    <text x="395" y="200" fill="#8b8794" font-size="10.5" text-anchor="middle" letter-spacing="1">NOW</text>
    <text x="640" y="200" fill="#7fe0b0" font-size="10.5" text-anchor="middle" letter-spacing="1">FORECAST</text>
  </g>

  <text x="60" y="410" fill="#6f6b78" font-size="11" letter-spacing="1" font-weight="500">SQL · PYTHON · TIME SERIES MODELS · POWER BI</text>
</svg>
